name: Refresh dashboards

# Rebuilds each warehouse from whatever is in data/raw, re-exports what the browser reads,
# and commits the result. Cloudflare Pages redeploys on the push.
#
# A failing dbt test stops that project's refresh before anything is exported, so the live
# dashboard keeps serving the last numbers that passed rather than publishing unchecked ones.
# The other three still refresh, and the job fails at the end so the failure is visible.
#
# Every project refreshes, not just the first one. A nightly job that quietly refreshed one of
# four would leave three dashboards stating a freshness they had not earned, which is worse
# than not refreshing at all.
#
# One job, one commit, on purpose. This was a four way matrix that committed and pushed per
# project, which meant four commits, four Cloudflare builds queued behind each other, and four
# installs of dbt per night. One commit is one build, and the toolchain installs once.
#
# Budget: roughly five minutes a night against the 2 000 Actions minutes a free account gets
# each month. Note also that GitHub disables a scheduled workflow after 60 days with no
# repository activity, so if the refresh ever goes quiet, check that before looking for a bug.

on:
  schedule:
    # 04:00 SAST (02:00 UTC) daily, before anyone opens the dashboard
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: One project folder, or "all"
        default: all
        required: true
  push:
    branches: [main, master]
    paths:
      - 'projects/*/data/raw/**'
      - 'projects/*/dbt/**'

permissions:
  contents: write

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet dbt-core dbt-duckdb duckdb

      - name: Check house style
        run: .venv/bin/python scripts/no_em_dashes.py

      - name: Refresh every project
        run: |
          want='${{ inputs.project }}'
          failed=''
          for p in 01-meridian-provisions 02-kestrel-logistics 03-sable-finch-credit 04-lumen-health; do
            if [ -n "$want" ] && [ "$want" != 'all' ] && [ "$want" != "$p" ]; then
              echo "Skipping $p, this run targets $want."
              continue
            fi
            echo "::group::$p"
            # Keep going on failure so one project's broken test cannot hold the other three
            # stale. The step fails at the end instead.
            if .venv/bin/python scripts/refresh.py --project "$p"; then
              echo "$p refreshed"
            else
              echo "::error title=Refresh failed::$p did not refresh, its dashboard keeps the last numbers that passed"
              failed="$failed $p"
            fi
            echo "::endgroup::"
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"

      # Runs even when a project failed, so the ones that did refresh still publish.
      - name: Commit the rebuilt artefacts
        if: always()
        run: |
          git config user.name  'omnatix-bot'
          git config user.email 'marshalldube9@gmail.com'
          git add projects/*/dashboard/data projects/*/ANSWER_KEY.md
          if git diff --staged --quiet; then
            echo 'Nothing changed, no commit.'
          else
            # The build date, not the data date. The demos cover a fixed period, so "data through
            # today" was a claim the data did not support.
            git commit -m "Refresh: rebuilt $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Fail if any project did not refresh
        if: always()
        run: |
          if [ -n "${FAILED// /}" ]; then
            echo "These projects did not refresh:$FAILED"
            exit 1
          fi
          echo 'All projects refreshed.'
