<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leshaw Business Hub</title>
  <meta name="description" content="Leshaw operations dashboard: sales, quotes, cut &amp; edge production, inventory and customers." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/ai.css" />
  <script>
    try { const t = localStorage.getItem('leshaw-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/overview" aria-label="Leshaw home">
        <span class="brand-logo"><img src="assets/logo.png" alt="Leshaw LSW" /></span>
        <span class="brand-text">
          <strong>Business Hub</strong>
          <small>Boards &amp; Hardware</small>
        </span>
      </a>
      <div class="brand-stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      <nav class="nav">
        <p class="nav-label">Workspace</p>
        <a href="#/overview" data-route="overview"><span data-icon="grid"></span>Overview</a>
        <a href="#/orders" data-route="orders"><span data-icon="receipt"></span>Orders<em class="nav-badge" id="nb-orders"></em></a>
        <a href="#/quotes" data-route="quotes"><span data-icon="file"></span>Quotes<em class="nav-badge" id="nb-quotes"></em></a>
        <a href="#/production" data-route="production"><span data-icon="saw"></span>Cut &amp; Edge<em class="nav-badge" id="nb-prod"></em></a>
        <p class="nav-label">Catalogue</p>
        <a href="#/inventory" data-route="inventory"><span data-icon="layers"></span>Inventory<em class="nav-badge warn" id="nb-stock"></em></a>
        <a href="#/customers" data-route="customers"><span data-icon="users"></span>Customers</a>
      </nav>

      <div class="sidebar-foot">
        <a class="site-link" href="https://leshaw-lsw.co.za/" target="_blank" rel="noopener"><span data-icon="globe"></span>View website<span data-icon="external" class="ext"></span></a>
        <div class="user-card">
          <span class="avatar">B</span>
          <span class="user-meta"><strong>Barnabas</strong><small>CEO · Spruitview</small></span>
          <button class="icon-btn" id="resetDemo" title="Reset demo data" aria-label="Reset demo data"><span data-icon="refresh"></span></button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><span data-icon="menu"></span></button>
        <div class="page-heading">
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSub">Today</p>
        </div>
        <button class="search-trigger" id="searchBtn" aria-label="Search">
          <span data-icon="search"></span><span class="st-text">Search orders, customers, boards…</span><kbd>⌘K</kbd>
        </button>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme"><span data-icon="moon"></span></button>
          <div class="pop-wrap">
            <button class="icon-btn" id="bellBtn" aria-label="Notifications"><span data-icon="bell"></span><i class="dot" id="bellDot"></i></button>
            <div class="popover" id="notifPop" hidden></div>
          </div>
          <button class="btn btn-primary" id="newQuoteBtn"><span data-icon="plus"></span><span class="hide-sm">New quote</span></button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Overlays -->
  <div class="drawer-wrap" id="drawer" hidden>
    <div class="drawer-scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
  </div>
  <div class="modal-wrap" id="modal" hidden>
    <div class="modal-scrim" data-close></div>
    <div class="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="palette-wrap" id="palette" hidden>
    <div class="modal-scrim" data-close></div>
    <div class="palette" role="dialog" aria-label="Search">
      <div class="palette-input"><span data-icon="search"></span><input id="paletteInput" placeholder="Search orders, customers, products, pages…" autocomplete="off" /><kbd>Esc</kbd></div>
      <div class="palette-results" id="paletteResults"></div>
    </div>
  </div>
  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <!-- The AI assistant: a pop-up on the hub's live data, answered by an open model (js/ai/). -->
  <script type="module" src="js/ai/ai.js"></script>
</body>
</html>
